name: CI

# One run per pull request, on its merge base. Strict branch protection makes the
# merged tree the tested tree, so main needs no run of its own.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.scope.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: node --test scripts/ci-scope.test.mjs
      - id: scope
        run: node scripts/ci-scope.mjs
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}

  editor:
    name: Editor
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: editor/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: pnpm
          cache-dependency-path: editor/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  app:
    name: App
    needs: changes
    # Drafts run only the fast lanes; marking the pull request ready runs the rest.
    if: needs.changes.outputs.build == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    # Public pull requests run only on hosted workers.
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      SIGNING: CODE_SIGNING_ALLOWED=YES CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: editor/package.json
      - name: Select Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)"
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          "$XCODE/Contents/Developer/usr/bin/xcodebuild" -version
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Verify generated project
        run: |
          xcodegen generate
          git diff --exit-code -- Memos.xcodeproj App/Info.plist App/Memos.entitlements CLI/Info.plist
          test -z "$(git ls-files --others --exclude-standard Memos.xcodeproj App/Info.plist App/Memos.entitlements CLI/Info.plist)"
      # The editor bundle builds here once; the later steps find it up to date.
      - name: Build for testing
        run: |
          xcodebuild -project Memos.xcodeproj -scheme Memos -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath build $SIGNING build-for-testing > build.log 2>&1 \
            || { grep -E 'error:' build.log | sort -u | head -40; exit 1; }
      - name: Unit and window tests
        run: |
          xcodebuild -project Memos.xcodeproj -scheme Memos -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath build -testPlan Full -resultBundlePath build/Full.xcresult \
            $SIGNING test-without-building > test.log 2>&1 \
            || { grep -E 'error:|failed' test.log | sort -u | head -40; exit 1; }
      - name: Build Release app
        run: |
          xcodebuild -quiet -project Memos.xcodeproj -scheme Memos -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build-release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= build
      - name: Build separate CLI
        run: |
          xcodebuild -quiet -project Memos.xcodeproj -scheme MemosTool -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build-cli CODE_SIGNING_ALLOWED=NO build
          python3 scripts/verify-cli.py build-cli/Build/Products/Release/memos
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: app-test-results
          retention-days: 7
          path: |
            *.log
            build/*.xcresult

  ui:
    name: UI
    needs: changes
    if: needs.changes.outputs.build == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: editor/package.json
      - name: Select Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)"
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          "$XCODE/Contents/Developer/usr/bin/xcodebuild" -version
      - name: Test application interactions
        env:
          TEST_RUNNER_MEMOS_UI_TESTS: 1
        run: |
          sudo /usr/sbin/DevToolsSecurity -enable
          xcodebuild -project 'Memos.xcodeproj' -scheme 'Memos UI Tests' -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath build-ui -resultBundlePath build-ui/Interactions.xcresult \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            test > ui.log 2>&1 \
            || { grep -E 'error:|failed' ui.log | sort -u | head -40; exit 1; }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-test-results
          retention-days: 7
          path: |
            ui.log
            build-ui/*.xcresult

  # The one required check. A lane its scope skipped counts as a pass; a failed
  # or cancelled lane, or a failed classifier, does not.
  result:
    name: CI result
    needs: [changes, editor, app, ui]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "A lane finished as: $result" >&2; exit 1 ;;
            esac
          done
