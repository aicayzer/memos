name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  editor:
    name: Editor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: editor/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: editor/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  app:
    name: App
    # Public pull requests run only on hosted workers.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: editor/package.json
      - name: Select Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)"
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          "$XCODE/Contents/Developer/usr/bin/xcodebuild" -version
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Verify generated project
        run: |
          xcodegen generate
          git diff --exit-code -- Memos.xcodeproj App/Info.plist App/Memos.entitlements CLI/Info.plist
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild \
            -project Memos.xcodeproj \
            -scheme Memos \
            -configuration Debug \
            -destination 'platform=macOS' -parallel-testing-enabled NO \
            -skip-testing:MemosTests/OverlayFocusTests \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            test | tee build.log | grep -E 'error:|warning: |Test .* (passed|failed)|\*\* '
      - name: Surface failures
        if: failure()
        run: grep -E '(^|[[:space:]])(error|failed):' build.log | sort -u | head -40 || true
      - name: Native window tests
        env:
          TEST_RUNNER_MEMOS_WINDOW_TESTS: 1
        run: |
          xcodebuild -quiet -project Memos.xcodeproj -scheme Memos -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath build -parallel-testing-enabled NO \
            -only-testing:MemosTests/OverlayFocusTests \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= test
      - name: Build separate CLI
        run: |
          xcodebuild -quiet -project Memos.xcodeproj -scheme MemosTool -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build-cli CODE_SIGNING_ALLOWED=NO build
          python3 scripts/verify-cli.py build-cli/Build/Products/Release/memos
