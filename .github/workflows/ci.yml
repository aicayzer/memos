name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  editor:
    name: Editor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: editor/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: editor/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  app:
    name: App
    # macOS 27 with Xcode 27, which is what the app is built and released with; the deployment target
    # stays at 26, which the 27 SDK builds for as a matter of course.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: editor/package.json
      - name: Select Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)"
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          "$XCODE/Contents/Developer/usr/bin/xcodebuild" -version
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - run: xcodegen generate
      # Suites that open a window run here and nowhere a person is working; xcodebuild hands the test
      # runner the TEST_RUNNER_ variables without the prefix.
      - name: Build and test
        env:
          TEST_RUNNER_MEMOS_WINDOW_TESTS: 1
        run: |
          set -o pipefail
          xcodebuild \
            -project Memos.xcodeproj \
            -scheme Memos \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            test | tee build.log | grep -E 'error:|warning: |Test .* (passed|failed)|\*\* '
      - name: Surface failures
        if: failure()
        run: grep -E '(^|[[:space:]])(error|failed):' build.log | sort -u | head -40 || true
