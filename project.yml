name: Memos
options:
  bundleIdPrefix: com.withmarfa
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
  defaultConfig: Debug
  groupSortPosition: top
configs:
  Debug: debug
  Release: release
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: "3.1.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # Keeps a Debug build self-contained when the .app is copied out of the build folder.
    ENABLE_DEBUG_DYLIB: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: JCVH9W76MS
    ENABLE_HARDENED_RUNTIME: YES
    # The editor build phase reads editor/ and writes into the bundle.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
targets:
  Memos:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: KeyboardShortcuts
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Memos
        CFBundleName: Memos
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHighResolutionCapable: true
    entitlements:
      path: App/Memos.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_NAME: Memos
        PRODUCT_BUNDLE_IDENTIFIER: com.withmarfa.memos
    preBuildScripts:
      - name: Build editor
        basedOnDependencyAnalysis: false
        shell: /bin/zsh
        script: |
          set -euo pipefail
          export PATH="$HOME/Library/pnpm:/opt/homebrew/bin:/usr/local/bin:$PATH"
          export CI=true
          cd "$SRCROOT/editor"
          pnpm install --frozen-lockfile --silent
          pnpm build --logLevel warn
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Editor"
          mkdir -p "$DEST"
          cp dist/index.html "$DEST/index.html"
  MemosTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Memos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.withmarfa.memos.tests
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: NO
schemes:
  Memos:
    build:
      targets:
        Memos: all
        MemosTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MemosTests
    archive:
      config: Release
