name: Memos
options:
  bundleIdPrefix: me.cyzr
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: en
  defaultConfig: Debug
  groupSortPosition: top
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: "3.1.0"
  ArgumentParser:
    url: https://github.com/apple/swift-argument-parser
    exactVersion: "1.8.2"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    # Keeps a Debug build self-contained when the .app is copied out of the build folder.
    ENABLE_DEBUG_DYLIB: NO
    ENABLE_HARDENED_RUNTIME: YES
    # Script sandboxing would block the editor phase's write into the bundle.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "0.4.2"
    CURRENT_PROJECT_VERSION: 2
    VERSIONING_SYSTEM: apple-generic
    # The app's identifier, which the command line tool reads to find the app's container.
    MEMOS_APP_IDENTIFIER: me.cyzr.memos
    MEMOS_DISPLAY_NAME: Memos
    MEMOS_URL_SCHEME: memos
  configs:
    Debug:
      MEMOS_APP_IDENTIFIER: me.cyzr.memos.dev
      MEMOS_DISPLAY_NAME: Memos Dev
      MEMOS_URL_SCHEME: memos-dev
targets:
  Memos:
    type: application
    platform: macOS
    sources:
      # The model and the store are shared with the command line tool, so they live outside App.
      - path: Core
      - path: App
        excludes:
          - "**/.DS_Store"
          # The icon as rendered and the screenshot, for the README; the app's own icon comes from AppIcon.icon.
          - Resources/AppIcon.png
          - Resources/AppIconDEV.png
          - Resources/Screenshot.png
          # The menu bar mark's artwork; the asset catalog carries the sizes drawn from it.
          - Resources/MenuBarIcon.png
    dependencies:
      - package: KeyboardShortcuts
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(MEMOS_DISPLAY_NAME)
        CFBundleName: $(MEMOS_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHighResolutionCapable: true
        # memos://memo/<id> shows a memo; the tool's open command sends it.
        CFBundleURLTypes:
          - CFBundleURLName: $(MEMOS_APP_IDENTIFIER)
            CFBundleURLSchemes: [$(MEMOS_URL_SCHEME)]
    entitlements:
      path: App/Memos.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # WebKit's helper processes refuse to launch in a sandbox without it; the page itself loads nothing remote.
        com.apple.security.network.client: true
        # Save As writes wherever the save panel points.
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    settings:
      base:
        PRODUCT_NAME: $(MEMOS_DISPLAY_NAME)
        PRODUCT_MODULE_NAME: Memos
        PRODUCT_BUNDLE_IDENTIFIER: $(MEMOS_APP_IDENTIFIER)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The app's accent, which the system uses for its own controls too unless the user chose one.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDEV
        Release:
          CODE_SIGN_STYLE: $(MEMOS_DISTRIBUTION_SIGNING_STYLE)
          PROVISIONING_PROFILE_SPECIFIER: $(MEMOS_DISTRIBUTION_PROFILE)
    preBuildScripts:
      - name: Build editor
        basedOnDependencyAnalysis: false
        shell: /bin/zsh
        script: |
          set -euo pipefail
          export PATH="$HOME/Library/pnpm:/opt/homebrew/bin:/usr/local/bin:$PATH"
          export CI=true
          cd "$SRCROOT/editor"
          pnpm install --frozen-lockfile --silent
          pnpm build --logLevel warn
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Editor"
          mkdir -p "$DEST"
          cp dist/index.html "$DEST/index.html"
  # Named apart from the app: the build's folders are case-insensitive.
  MemosTool:
    type: tool
    platform: macOS
    sources:
      - path: Core
      - path: CLI
    dependencies:
      - package: ArgumentParser
    info:
      path: CLI/Info.plist
      properties:
        MemosAppIdentifier: $(MEMOS_APP_IDENTIFIER)
        MemosURLScheme: $(MEMOS_URL_SCHEME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_NAME: memos
        # The module name would otherwise follow the product's and clash with the app's on a case-insensitive disk.
        PRODUCT_MODULE_NAME: MemosTool
        PRODUCT_BUNDLE_IDENTIFIER: $(MEMOS_APP_IDENTIFIER).cli
        # A tool has no bundle; the plist rides in the binary, and is its main bundle's wherever it runs from.
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        # The command-line tool is distributed separately from the App Store app.
        SKIP_INSTALL: YES
  MemosTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Memos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MEMOS_APP_IDENTIFIER).tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/$(MEMOS_DISPLAY_NAME).app/Contents/MacOS/$(MEMOS_DISPLAY_NAME)
        BUNDLE_LOADER: $(TEST_HOST)
        ENABLE_HARDENED_RUNTIME: NO
  MemosUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
    dependencies:
      - target: Memos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MEMOS_APP_IDENTIFIER).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Memos
        ENABLE_HARDENED_RUNTIME: NO
schemes:
  Memos UI Tests:
    build:
      targets:
        Memos: all
        MemosUITests: [test]
    test:
      config: Debug
      targets:
        - name: MemosUITests
          parallelizable: false
  Memos:
    build:
      targets:
        Memos: all
        MemosTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: MemosTests
          parallelizable: false
    archive:
      config: Release
  MemosTool:
    build:
      targets:
        MemosTool: all
    run:
      config: Debug
    archive:
      config: Release
