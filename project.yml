name: Memos
options:
  bundleIdPrefix: me.cyzr
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
  defaultConfig: Debug
  groupSortPosition: top
configs:
  Debug: debug
  Release: release
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: "3.1.0"
  ArgumentParser:
    url: https://github.com/apple/swift-argument-parser
    exactVersion: "1.8.2"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.10.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # Keeps a Debug build self-contained when the .app is copied out of the build folder.
    ENABLE_DEBUG_DYLIB: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: JCVH9W76MS
    ENABLE_HARDENED_RUNTIME: YES
    # Script sandboxing would block the editor phase's write into the bundle.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
    # The app's identifier, which the command line tool reads to find the app's container.
    MEMOS_APP_IDENTIFIER: me.cyzr.memos
targets:
  Memos:
    type: application
    platform: macOS
    sources:
      # The model and the store are shared with the command line tool, so they live outside App.
      - path: Core
      - path: App
        excludes:
          - "**/.DS_Store"
          # The icon as rendered, for the README; the app's own comes from AppIcon.icon.
          - Resources/AppIcon.png
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
      # The tool ships inside the app, at Contents/SharedSupport/bin/memos, for a symlink onto the PATH;
      # not beside the app's own binary, whose name it shares on a case-insensitive disk.
      - target: MemosTool
        embed: true
        copy:
          destination: sharedSupport
          subpath: bin
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Memos
        CFBundleName: Memos
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        # Updates: the appcast and the images behind it, signed with the key whose public half is here.
        SUFeedURL: https://memos.cyzr.me/appcast.xml
        SUPublicEDKey: apMBXLwhW5Rjrq2BSNCShF6yTNCwcGKPH+U01Hg5sOg=
        # The app is sandboxed, so an update is installed by Sparkle's launcher service.
        SUEnableInstallerLauncherService: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHighResolutionCapable: true
        # memos://memo/<id> shows a memo; the tool's open command sends it.
        CFBundleURLTypes:
          - CFBundleURLName: $(MEMOS_APP_IDENTIFIER)
            CFBundleURLSchemes: [memos]
    entitlements:
      path: App/Memos.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # WebKit's helper processes refuse to launch in a sandbox without it; the page itself loads nothing remote.
        com.apple.security.network.client: true
        # Save As writes wherever the save panel points.
        com.apple.security.files.user-selected.read-write: true
        # The names Sparkle's installer tools are reached by from inside the sandbox.
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
    settings:
      base:
        PRODUCT_NAME: Memos
        PRODUCT_BUNDLE_IDENTIFIER: $(MEMOS_APP_IDENTIFIER)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    preBuildScripts:
      - name: Build editor
        basedOnDependencyAnalysis: false
        shell: /bin/zsh
        script: |
          set -euo pipefail
          export PATH="$HOME/Library/pnpm:/opt/homebrew/bin:/usr/local/bin:$PATH"
          export CI=true
          cd "$SRCROOT/editor"
          pnpm install --frozen-lockfile --silent
          pnpm build --logLevel warn
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Editor"
          mkdir -p "$DEST"
          cp dist/index.html "$DEST/index.html"
  # Named apart from the app: the build's folders are case-insensitive.
  MemosTool:
    type: tool
    platform: macOS
    sources:
      - path: Core
      - path: CLI
    dependencies:
      - package: ArgumentParser
    info:
      path: CLI/Info.plist
      properties:
        MemosAppIdentifier: $(MEMOS_APP_IDENTIFIER)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_NAME: memos
        # The module name would otherwise follow the product's and clash with the app's on a case-insensitive disk.
        PRODUCT_MODULE_NAME: MemosTool
        PRODUCT_BUNDLE_IDENTIFIER: $(MEMOS_APP_IDENTIFIER).cli
        # A tool has no bundle; the plist rides in the binary, and is its main bundle's wherever it runs from.
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        # Installed on its own into an archive, the tool would make it a generic one that cannot be exported.
        SKIP_INSTALL: YES
  MemosTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Memos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.cyzr.memos.tests
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: NO
schemes:
  Memos:
    build:
      targets:
        Memos: all
        MemosTool: all
        MemosTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MemosTests
    archive:
      config: Release
